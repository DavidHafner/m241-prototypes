name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file exe
        run: >
          dotnet publish desktop/Marschzeit.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out
      - name: Rename exe
        run: Rename-Item out/Marschzeit.exe Marschzeittabelle.exe
        shell: pwsh
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marschzeittabelle-win-x64
          path: out/Marschzeittabelle.exe
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/Marschzeittabelle.exe --title "${{ github.ref_name }}" --generate-notes
        shell: pwsh
