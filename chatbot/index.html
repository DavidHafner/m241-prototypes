<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marschzeit-Chatbot (Prototyp)</title>
<style>
  :root { color-scheme:light dark; --bg:#fff; --fg:#1a1a1a; --bot:#eef1ea; --me:#3d6b1f; --mefg:#fff; --card:#f1f3ee; --muted:#555; --accent:#2d6a10; --inbg:#f6f6f6; --inborder:#aaa; --line:#d5d9d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#eee; --bot:#232623; --card:#1c1c1c; --muted:#aaa; --accent:#a6e88a; --inbg:#1e1e1e; --inborder:#555; --line:#333; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); height:100dvh; display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); font-weight:600; display:flex; gap:16px; align-items:center; }
  a.home { color:var(--accent); text-decoration:none; font-weight:normal; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; max-width:820px; width:100%; margin:0 auto; }
  .msg { flex-shrink:0; max-width:85%; padding:10px 14px; border-radius:16px; line-height:1.4; }
  .bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; }
  .me { background:var(--me); color:var(--mefg); align-self:flex-end; border-bottom-right-radius:4px; }
  .wide { max-width:100%; align-self:stretch; background:var(--card); overflow-x:auto; }
  .typing { color:var(--muted); font-style:italic; }
  ul { margin:6px 0 0; padding-left:20px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; height:3.2em; border:1px solid var(--inborder); border-radius:10px; padding:8px 10px; font:inherit; background:var(--inbg); color:var(--fg); cursor:default; }
  textarea:focus { outline:2px solid var(--me); }
  button { background:var(--me); color:#fff; border:0; border-radius:14px; padding:8px 18px; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  table { border-collapse:collapse; width:100%; font-size:.85rem; margin-top:6px; }
  th, td { padding:3px 8px; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align:left; }
  tr + tr td { border-top:1px solid var(--line); }
  .sum { margin-top:8px; color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<header><a class="home" id="home" href="../">← Übersicht</a><span>🥾 Marschzeit-Assistent</span></header>
<div id="log" aria-live="polite"></div>
<form id="form">
  <!-- Read-only on purpose: the prototype only lets the user send the prepared answer -->
  <textarea id="input" readonly rows="2" aria-label="Vorbereitete Antwort (nur absenden)"></textarea>
  <button id="send" type="submit">Senden</button>
</form>

<script>
// ---- Demo mode: ?nodownload disables the CSV download; keep the query string on the back link ----
const NO_DL = new URLSearchParams(location.search).has("nodownload");
document.getElementById("home").href = "../" + location.search;

// ---- Fixed conversation data (route Grindelwald → Meiringen via Grosse Scheidegg) ----
const ROUTE = [
  { name: "Grindelwald",      height: 1034, dist: 0,   pause: 0  },
  { name: "Grosse Scheidegg", height: 1962, dist: 9.2, pause: 20, why: "Passhöhe, schöne Aussicht aufs Wetterhorn" },
  { name: "Schwarzwaldalp",   height: 1454, dist: 3.6, pause: 0,  why: "Einkehrmöglichkeit" },
  { name: "Rosenlaui",        height: 1328, dist: 2.6, pause: 45, why: "Mittagessen, Rosenlauischlucht in der Nähe" },
  { name: "Meiringen",        height:  595, dist: 7.4, pause: 0  },
];
const SPEED = 4, START = 8;   // Lkm/h, hours

// ---- Same calculation rules as the other prototypes (marschzeittabelle) ----
function calculate(route, speed, start) {
  let dist = 0, effort = 0, brk = 0, ascent = 0, descent = 0;
  const rows = route.map((p, i) => {
    const r = { nr: i + 1, name: p.name, height: p.height, pause: p.pause, dHeight: 0, dDist: 0, dEffort: 0 };
    if (i > 0) {
      const run = p.dist * 1000, rise = p.height - route[i-1].height, slope = rise / run;
      let e = p.dist;
      if (slope > 0) e += rise / 100; else if (slope < -0.2) e += Math.abs(rise) / 150;
      if (rise > 0) ascent += rise; else descent -= rise;
      brk += route[i-1].pause; dist += p.dist; effort += e;
      Object.assign(r, { dHeight: rise, dDist: p.dist, dEffort: e });
    }
    Object.assign(r, { dist, effort, gehzeit: effort / speed });
    r.time = r.gehzeit + brk / 60 + start;
    r.dGehzeit = i > 0 ? r.gehzeit - (effort - r.dEffort) / speed : 0;
    return r;
  });
  const last = rows.at(-1);
  return { rows, dist, effort, ascent, descent, gehzeit: last.gehzeit, arrival: last.time,
           pauses: route.slice(0, -1).reduce((s, p) => s + p.pause, 0) };
}
const pad = n => String(n).padStart(2, "0");
const parts = h => { const H = Math.floor(h); return [H, Math.floor((h - H) * 60)]; };
const fTime = h => { const [H, m] = parts(h); return `${pad(H % 24)}:${pad(m)}`; };
const fDur  = h => { const [H, m] = parts(h); return `${H}:${pad(m)}`; };

function csv(res) {
  const head = ["Nr.","Wegpunkt","Höhe / m","Differenz Höhe / m","Total Distanz / km","Differenz Distanz / km","Total Aufwand / Lkm","Differenz Aufwand / Lkm","Total Gehzeit / h","Differenz Gehzeit / h","Uhrzeit / hh:mm","Pause / min"];
  const q = v => `"${String(v).replace(/"/g, '""')}"`, n = v => v.toFixed(2);
  const rows = res.rows.map(w => [w.nr, w.name, w.height, w.dHeight, n(w.dist), n(w.dDist), n(w.effort), n(w.dEffort), n(w.gehzeit), n(w.dGehzeit), fTime(w.time), w.pause]);
  return "﻿" + [head, ...rows].map(l => l.map(q).join(",")).join("\r\n");
}
function download(res) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv(res)], { type: "text/csv;charset=utf-8" }));
  a.download = "marschzeittabelle.csv"; a.click();
}

// ---- Script: each step = bot question + the prepared user answer ----
const result = calculate(ROUTE, SPEED, START);
const steps = [
  { ask: "Hallo! Ich helfe dir, eine Wanderung zu planen. Wo möchtest du starten?",
    answer: "Ich starte in Grindelwald." },
  { ask: "Super, Start ist Grindelwald. Und wohin soll es gehen?",
    answer: "Mein Ziel ist Meiringen." },
  { ask: "Grindelwald → Meiringen, das geht gut über die Grosse Scheidegg. Wann möchtest du losgehen?",
    answer: "Ich möchte um 08:00 Uhr starten." },
  { ask: () => `Ich schlage folgende Zwischenstopps vor:<ul>${ROUTE.slice(1, -1).map(p => `<li><b>${p.name}</b> (${p.height} m): ${p.why}</li>`).join("")}</ul>Passt das für dich?`,
    answer: "Ja, die Stopps passen." },
  { ask: () => `Dann empfehle ich diese Pausen:<ul>${ROUTE.filter(p => p.pause).map(p => `<li><b>${p.pause} Min.</b> in ${p.name}</li>`).join("")}</ul>Soll ich die Marschzeittabelle damit berechnen?`,
    answer: "Ja, bitte berechne die Tabelle." },
];

// ---- UI ----
const log = document.getElementById("log"), input = document.getElementById("input"), send = document.getElementById("send");
let step = 0, busy = false;

function add(cls, html) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
const wait = ms => new Promise(r => setTimeout(r, ms));

async function botSay(content) {
  const t = add("bot typing", "schreibt …");
  await wait(600);
  t.remove();
  return add("bot", typeof content === "function" ? content() : content);
}

function prepare() {
  if (step < steps.length) { input.value = steps[step].answer; send.disabled = false; send.textContent = "Senden"; }
  else { input.value = ""; send.disabled = false; send.textContent = "Neu starten"; }
}

async function showResult() {
  const r = result;
  await botSay("Fertig! Hier ist deine Marschzeittabelle:");
  const d = add("bot wide", `<table><tr><th>Nr.</th><th>Wegpunkt</th><th>Höhe</th><th>Distanz</th><th>Aufwand</th><th>Gehzeit</th><th>Uhrzeit</th><th>Pause</th></tr>` +
    r.rows.map(w => `<tr><td>${w.nr}</td><td>${w.name}</td><td>${w.height} m</td><td>${w.dist.toFixed(1)} km</td><td>${w.effort.toFixed(1)} Lkm</td><td>${fDur(w.gehzeit)} h</td><td>${fTime(w.time)}</td><td>${w.pause ? w.pause + " min" : ""}</td></tr>`).join("") +
    `</table><div class="sum">${r.dist.toFixed(1)} km · ↑ ${Math.round(r.ascent)} m ↓ ${Math.round(r.descent)} m · ${r.effort.toFixed(1)} Lkm bei ${SPEED} Lkm/h · Gehzeit ${fDur(r.gehzeit)} h · Pausen ${fDur(r.pauses / 60)} h · Ankunft ${fTime(r.arrival)}</div>
    <p><button type="button" id="csvBtn">Als CSV speichern</button></p>`);
  d.querySelector("#csvBtn").onclick = e => {
    if (!NO_DL) return download(r);
    const b = e.currentTarget, text = b.textContent;
    b.textContent = "Download deaktiviert (Demo)"; setTimeout(() => b.textContent = text, 1500);
  };
}

async function advance() {
  if (step >= steps.length) { log.innerHTML = ""; step = 0; await start(); return; }
  busy = true; send.disabled = true;
  add("me", input.value); input.value = "";
  step++;
  if (step < steps.length) await botSay(steps[step].ask);
  else await showResult();
  busy = false; prepare();
}

async function start() {
  busy = true; send.disabled = true;
  await botSay(steps[0].ask);
  busy = false; prepare();
}

document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); if (!busy) advance(); });
start();
</script>
</body>
</html>
